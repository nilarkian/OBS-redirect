<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OBS</title>
    <script>
        const url = location.search.slice(1);
        location.replace(url); // Fast redirect without history entry

        setTimeout(() => {
            window.open('', '_self').close(); // Attempts to close the tab
        }, 5000); // Short delay to allow redirect before closing
    </script>
</head>
<body></body>
</html>
